name: Feature request
description: 提出一个新功能或改进建议 / Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述**使用场景**，再说你希望的解决方案 —— 场景比结论更有价值。
        Describe the scenario first, then the solution you have in mind.

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Scenario
      description: 你在做什么的时候遇到了什么不便？
      placeholder: 我同时开三个前端项目，需要快速确认 3000 / 5173 / 8080 分别被谁占用。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      placeholder: 希望在关注卡片上直接显示进程名，不用点开详情。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives
      description: 现在你是怎么绕过这个问题的？
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 已搜索现有 Issue，确认没有重复
          required: true
