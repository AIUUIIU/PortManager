name: Bug report
description: 报告一个可复现的问题 / Report a reproducible bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把信息填完整，缺少版本和复现步骤的 Issue 很难定位。
        Thanks for reporting — please fill in the version and steps to reproduce.

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述 / What happened
      description: 实际发生了什么？期望的结果是什么？
      placeholder: 打开应用后端口列表为空，期望显示全部监听端口。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 启动 Port Manager
        2. 在搜索框输入 8080
        3. 点击「释放」
        4. 出现错误提示 …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Port Manager 版本 / Version
      description: 见「设置」页底部或 exe 文件属性
      placeholder: 1.2.5
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本 / Windows version
      options:
        - Windows 11 24H2
        - Windows 11 23H2
        - Windows 11 22H2
        - Windows 11 其他版本
        - Windows 10 22H2
        - Windows 10 其他版本
        - Windows Server
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: 架构 / Architecture
      options:
        - x64
        - ARM64
        - x86
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: 主题 / Theme
      options:
        - 跟随系统
        - 浅色
        - 深色
        - 与主题无关
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息 / Screenshots or logs
      description: 直接把图片拖进来即可
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 已搜索现有 Issue，确认没有重复
          required: true
        - label: 使用的是最新 Release 版本
          required: true
