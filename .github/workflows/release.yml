name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 从 CHANGELOG.md 提取当前版本的段落，拼上下载说明，作为 Release 正文。
      # 不这样做的话，只有一个 commit 的仓库 generate_release_notes 会产出空内容。
      - name: Build release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          $nl = [char]10

          $lines = Get-Content -Path 'CHANGELOG.md' -Encoding UTF8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s*\[$([regex]::Escape($ver))\]") { $start = $i; break }
          }

          if ($start -ge 0) {
            $end = $lines.Count - 1
            for ($j = $start + 1; $j -lt $lines.Count; $j++) {
              if ($lines[$j] -match '^##\s*\[') { $end = $j - 1; break }
            }
            $changes = ($lines[($start + 1)..$end] -join $nl).Trim()
          } else {
            $changes = "See [CHANGELOG.md](CHANGELOG.md) for details."
          }

          $header = @(
            '## 下载 / Download',
            '',
            '| 平台 / Platform | 文件 / File |',
            '| --- | --- |',
            '| Windows x64 | `PortManager-win-x64.zip` |',
            '| Windows ARM64 | `PortManager-win-arm64.zip` |',
            '',
            '解压后双击 `PortManager.exe`，无需安装，不需要预装 Windows App SDK 运行时。',
            'Extract and run — no installation, no Windows App SDK runtime required.',
            '',
            '---',
            '',
            '## 更新内容 / What''s changed',
            ''
          ) -join $nl

          ($header + $nl + $changes) | Set-Content -Path 'release-body.md' -Encoding UTF8
          Write-Output "release notes written: $((Get-Item release-body.md).Length) bytes"

      - name: Publish
        run: >
          dotnet publish PortManagerWin.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -o out/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath PortManager-${{ matrix.rid }}.zip -Force

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: PortManager-${{ matrix.rid }}.zip
          body_path: release-body.md
          draft: false
