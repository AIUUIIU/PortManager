name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish PortManagerWin.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -o out/${{ matrix.rid }}

      - name: Package
        run: |
          Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath PortManager-${{ matrix.rid }}.zip -Force

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: PortManager-${{ matrix.rid }}.zip
          generate_release_notes: true
          draft: false
