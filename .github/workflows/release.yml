name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 用 .github/release-template.md 生成 Release 正文：提取 CHANGELOG 中当前版本的
      # 段落填入 {{CHANGELOG}}，版本号与日期取自 tag 和该段落标题。
      - name: Build release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          $nl = [string][char]10

          $lines = Get-Content -Path 'CHANGELOG.md' -Encoding UTF8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s*\[$([regex]::Escape($ver))\]") { $start = $i; break }
          }

          if ($start -ge 0) {
            $end = $lines.Count - 1
            for ($j = $start + 1; $j -lt $lines.Count; $j++) {
              if ($lines[$j] -match '^##\s*\[') { $end = $j - 1; break }
            }
            $changes = ($lines[($start + 1)..$end] -join $nl).Trim()
          } else {
            $changes = 'See [CHANGELOG.md](CHANGELOG.md) for details.'
            Write-Warning "CHANGELOG 中找不到版本 $ver 的段落"
          }

          $date = (Get-Date).ToString('yyyy-MM-dd')
          if ($start -ge 0 -and $lines[$start] -match '(\d{4}-\d{2}-\d{2})') { $date = $Matches[1] }

          $body = Get-Content -Path '.github/release-template.md' -Encoding UTF8 -Raw
          $body = $body.Replace([string][char]13, '')
          $body = $body.Replace('{{VERSION}}', $ver).Replace('{{DATE}}', $date).Replace('{{CHANGELOG}}', $changes)

          Set-Content -Path 'release-body.md' -Value $body -Encoding UTF8 -NoNewline
          Write-Output "release notes written: $((Get-Item release-body.md).Length) bytes"

      - name: Publish
        run: >
          dotnet publish PortManagerWin.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -o out/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath PortManager-${{ matrix.rid }}.zip -Force

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: PortManager-${{ matrix.rid }}.zip
          body_path: release-body.md
          draft: false
